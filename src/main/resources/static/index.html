<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Intelligence</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px;background:#f7f9fc}main,article{padding:20px;background:white;margin:14px 0;border-radius:12px}textarea{width:95%;height:110px}textarea,input,button{font:inherit;padding:10px;margin:5px}button{background:#1746a2;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap}</style></head><body><h1>AI Document Intelligence</h1><p>Paste synthetic text and ask questions grounded in the document. No file uploads or vector search yet.</p><main><form id="form"><input id="name" placeholder="Document name" required><textarea id="text" required placeholder="Paste document text"></textarea><button>Save document</button></form><p id="message" role="status"></p></main><section id="results"></section><script>
const api='/api/v1/documents';
async function request(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function refresh(){try{const records=await request(api);const box=document.getElementById('results');box.replaceChildren();for(const record of records){const card=document.createElement('article');const h=document.createElement('h3');h.textContent=record.name;const q=document.createElement('input');q.placeholder='Ask about this document';const ask=document.createElement('button');ask.textContent='Ask Gemini';const answer=document.createElement('pre');ask.onclick=async()=>{answer.textContent='Generating...';try{const response=await request(api+'/'+record.id+'/ask',{method:'POST',body:JSON.stringify({question:q.value})});answer.textContent=response.answer}catch(e){answer.textContent=e.message}};const del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{await request(api+'/'+record.id,{method:'DELETE'});await refresh()};card.append(h,q,ask,del,answer);box.append(card)}}catch(e){document.getElementById('message').textContent=e.message}}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{await request(api,{method:'POST',body:JSON.stringify({name:document.getElementById('name').value,text:document.getElementById('text').value})});e.target.reset();await refresh()}catch(error){document.getElementById('message').textContent=error.message}};refresh();
</script></body></html>
